name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile pomodoro.py
      - name: Smoke test
        run: |
          python pomodoro.py --version
          python pomodoro.py --stats --lang en
          python pomodoro.py --stats --lang uk
      - name: Install as a package
        run: |
          python -m pip install .
          pomodoro --version
